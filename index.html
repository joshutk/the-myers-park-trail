DATA.bios = {
  gammon:"Myers Park's founding pastor, called in 1927 to a flock of 256 with no building, no lot, and no funds. Gammon led with such force that a newspaper called him \"as vibrant with energy as a Leyden jar,\" insisting on raising a true church home first and carrying the young congregation through the Depression.",
  jones:"A spellbinding preacher, \"the ultimate master of the English language,\" Jones arrived at age 28 and became nationally known, even preaching to President Eisenhower. He led the church as they planted daughter churches and championed denominational reunion decades before his peers.",
  fogartie:"Warm and beloved, Fogartie served nineteen years, the longest tenure in the church's history, growing it from 2,138 to 3,000 members. A gifted baritone, he once sang \"How Great Thou Art\" to a packed Coliseum at Billy Graham's 1958 Crusade.",

DATA.trail = [
  { year:1926, type:"start", short:true, name:"Queens College Chapel",
    scene:["Eighty-two people sign a petition","for a new church in Myers Park.","It's really happening!"],
    fact:["On October 10, 1926, one hundred eighteen people met in the Queens College chapel and eighty-two of them signed a petition to organize a new Presbyterian church in Myers Park. By the time it was formally organized that November it already had two hundred forty-five members.","Myers Park was then a brand-new streetcar suburb of tree-lined curving streets. The founders had no building, no lot, and, as one of them put it, no funds for either. They were excited to get going anyway."], page:"p.6-8" },
  { year:1927, type:"cross", short:true, name:"Building the First Church", campaign:"Founders Campaign", goal:275000,
    scene:["The first pastor sees the new lot \"fit only for broom-straw,\"","sinks into a chair, and asks: \"What in the world?\""],
    fact:["The Founders Campaign raised about two hundred seventy-five thousand dollars for the stone Sanctuary and the Sunday School classrooms behind it. The architects gave it an English Gothic look, and the stone was hauled from a quarry at the edge of the Myers Park Country Club by mule.","Stone kept disappearing from the construction site overnight, so the church hired a night watchman."], page:"p.19-34, 433" },
  { year:1929, type:"land", short:true, name:"First Service in the Sanctuary",
    scene:["The first worship service held on","the church's own property."],
    fact:["The first service in the stone Sanctuary was held in April 1929 on a very warm Sunday. There was no air conditioning, and the temperature was in the eighties. One founding member still pronounced it very, very comfortable.","Air conditioning did not arrive until 1952."], page:"p.38" },
  { year:1931, type:"land", short:false, name:"The Depression Reaches the Pews",

    fact:["Four of Charlotte's seven banks failed during the Depression, and contributions to the church fell with them. In 1932 the Session cut the pay of the paid choir members by a quarter.","None of the singers quit, and benevolences were not reduced. They also proceeded with construction of the manse the church had promised its first pastor, albeit four years behind schedule."], page:"p.52-55" },
  { year:1941, type:"land", short:true, name:"A Church on the Home Front",
    scene:["The new Educational Building opens.","The Second World War begins soon after.","Many members go off to serve."],
    fact:["A 1940 campaign raised a hundred and fifty thousand dollars for a three-story Educational Building (the B Building today) — Sunday-School classes had been crowded and they needed more space. It opened in late 1941, just as the United States entered the Second World War.","The church was named a civil-defense welfare station. In 1944, German prisoners of war were brought to Myers Park to clear the pine trees along what is now Hampton Avenue."], page:"p.68, 73, 86-89" },
  { year:1944, type:"land", short:false, name:"The Noon Prayer Bell",
    scene:["The bell rings at noon for the troops.","German prisoners of war clear the","pines out front."],
    fact:["Beginning in May 1944 the church rang its bell every day at noon and asked the congregation, wherever they were, to stop and pray for the men and women overseas. The church kept a Servicemen's Bulletin to stay in touch with those who had shipped out.","On D-Day, the building was left open all day so people could come in and pray."], page:"p.86-90" },
  { year:1952, type:"land", short:true, name:"The Children's Building",
    scene:["The new Children's Building opens!","Session air-conditions the Sanctuary in","your absence. Congratulations."],
    fact:["A year earlier, the church's twenty-fifth-anniversary campaign had raised three hundred thousand dollars — a hundred and eighty thousand to build a new Children's Building (the C Building today), and the rest to help start churches across Charlotte. The building opened around 1952.","That same year, while pastor James A. Jones was away touring global mission sites including Congo, the officers voted to air-condition the Sanctuary — reasoning it would boost summer attendance. Jones found out when he got home."], page:"p.114, 119, 122-123" },
  { year:1959, type:"cross", short:true, name:"Expanding the Sanctuary", campaign:"Sanctuary Expansion", goal:1113000,
    scene:["Space in the original Sanctuary is getting tight! Time to expand."],
    fact:["The 1959 campaign raised over a million dollars. It lengthened the Sanctuary by two windows' worth of pews and added an Education and Fellowship Building (the D Building today). The front wall of the Sanctuary was supposed to come down with a wrecking ball — but the ball bounced off the granite, and the crew finished the job with hammers and chisels."], page:"p.138-144, 433" },
  { year:1962, type:"land", short:false, name:"Rededication",
    scene:["The Sanctuary reopens with a new Casavant","organ and Willet stained glass reredos."],
    fact:["The expanded Sanctuary was rededicated in March 1962. It had a new thirty-six-hundred-pipe organ and, behind the communion table, a fancy new reredos. It was also reconfigured from a two-aisle layout to a single center aisle.","The stained-glass windows replaced the old clear glass over the course of the 1960s."], page:"p.142-144" },
  { year:1971, type:"land", short:true, name:"First Women Elders",
    scene:["The first women are ordained","as church elders."], straight:true,
    fact:["In November 1971 Lib Harkey and Danny Verner were ordained as the church's first women elders, a year after the first women deacons. The denomination had voted to ordain women as elders in 1964.","One member objected, saying that the women's high heels would clatter on the stone floor as they served communion. Lib Harkey made sure she wore her heels."], page:"p.179-180" },
  { year:1976, type:"land", short:false, name:"50th Anniversary",
    scene:["A jubilant celebration, including","a \"Saints and Sinners\" roast."],
    fact:["The fiftieth anniversary in May 1976 included a Saints and Sinners evening where the congregation roasted itself. The new pastor, J. Randolph Taylor, was teased for not preaching enough hellfire.","One member played Lucifer and sang a number that included the line \"Down with virtue, down with goodness, sin is here to stay!\""], page:"p.197-198" },
  { year:1983, type:"land", short:true, name:"Reunion in Atlanta",
    scene:["The Southern and Northern churches","are reunited to become the PC(USA)."], straight:true,
    fact:["In June 1983 the northern and southern Presbyterian churches reunited at the General Assembly in Atlanta after one hundred twenty-two years apart, a split that dated to the Civil War. Eight thousand Presbyterians marched through downtown behind bagpipes.","Myers Park's pastor, J. Randolph Taylor, was elected the first Moderator of the reunited church. His duties as Moderator would mean significant time away from the church."], page:"p.223-225" },
  { year:1989, type:"cross", short:true, name:"Building the Christian Life Center", campaign:"New Horizons", goal:6000000,
    scene:["Building a gym and dedicated office","space for pastors and staff."],
    fact:["The New Horizons campaign raised about six million dollars for the Christian Life Center, a new slate roof, and an elevator that the children promptly tied up riding up and down. The thirty-thousand-square-foot building added a gym and meeting space the church had wanted for years.","Hurricane Hugo tore through Charlotte in September 1989, downing eighty thousand trees and leaving most of the city without power. The church held a relief breakfast and broke ground on the new building about a week later."], page:"p.256-263, 434" },
  { year:1996, type:"land", short:false, name:"Room in the Inn",
    scene:["Neighbors without homes sleep in the","church. A house rolls down Providence","Road at midnight."],
    fact:["Room in the Inn began at the church in December 1996, offering people without a home a warm place to sleep through the winter. It continues today.","In 1997, the lot across Providence Road was purchased by the church. The house that stood on it was picked up and moved down Providence Road at midnight to a new location."], page:"p.287-289, 342" },
  { year:2002, type:"land", short:false, name:"Celebrate Launches",
    scene:["A new worship service begins in the gym","during an interim time between head of","staff pastors."],
    fact:["The Celebrate service began in February 2002 in the Christian Life Center gym. It was a more casual, contemporary service than the one in the Sanctuary. Tarps were spread on the gym floor and a video feed carried the sermon.","About three hundred people came to the first one. The organizers had hoped it would bring in people the traditional service was not reaching."], page:"p.312-314" },
  { year:2008, type:"cross", short:true, name:"Building the Outreach Center", campaign:"Deeper Discipleship", goal:27220300,
    scene:["The Great Recession hits as the church","sets out to raise millions of dollars."],
    fact:["The Deeper Discipleship campaign raised twenty-seven million dollars even as the 2008 financial crisis unfolded around it. It built the Outreach Center, turned the Christian Life Center into classrooms, Oxford Hall, and the Welcome Center, paid off three million dollars of debt, and invested significantly in our Outreach partnerships.","That December, the church still needed one point six million dollars for the annual budget. One cost-cutting idea on the table was to stop giving away coffee, saving about seventeen thousand dollars a year."], page:"p.331-340, 356, 434" },
  { year:2011, type:"land", short:false, name:"The Outreach Center Opens",
    scene:["A new building across the road."],
    fact:["The Outreach Center was dedicated in June 2011. It added a wellness center, meeting rooms, and space for the church's growing outreach ministries.","The church had planned for about one hundred fifty Wellness Ministry memberships. Five hundred seventy-six people signed up."], page:"p.353, 356" },
  { year:2015, type:"land", short:true, name:"The Wedding Policy",
    scene:["The denomination has changed its","definition of marriage to include","people of the same gender. Session","holds a town hall."], straight:true,
    fact:["In 2015, after the denomination changed its definition of marriage, the Session held a town hall, several listening sessions, and plenty of meetings to determine a path forward. They ultimately amended the church's wedding policy to include people of all genders. Some families left and annual giving declined."], page:"p.367-368" },
  { year:2020, type:"cross", short:true, name:"Renovating the Children's Buildings", campaign:"Cultivate", goal:22025700,
    scene:["A new campaign launched in the","middle of a pandemic."],
    fact:["The Cultivate campaign was approved in December 2019 and launched in 2021, in the middle of the COVID-19 pandemic. It renovated the Weekday School, children's ministry spaces, Providence Hall, Cornerstone House, and the columbarium. It also funded a connector building between the C and D buildings and invested heavily in affordable housing and housing stability programs.","When worship first moved online due to COVID, a Sunday might have thirty-three people in the building and nine hundred fifty watching from home. A Zoom morning prayer started then and continues today."], page:"p.394-400, 434" },
  { year:2026, type:"end", short:true, name:"Centennial Sunday",
    scene:["One hundred years.","You made it!"],
    fact:["Centennial week: November 1 through 8, 2026. The church that started in 1926 with two hundred forty-five members and no building reported four thousand seven hundred thirty-five members in 2024."], page:"p.419" }
];

  { y:1927, t:["Your first budget forgot to include","fire insurance, calendars and","music. Whoops."], fx:{budget:-0.03}, page:"p.30", fact:["The founders of our church didn't have the benefit of a \"parent church\" in the typical sense, and in some ways were learning on the job."] },
  { y:1928, t:["Stone keeps walking off the","building site at night. You hire","a night watchman."], fx:{budget:-0.01}, page:"p.34", fact:["It took a lot of stone, and a lot of mule cart trips hauling it down from a quarry near the country club, to build the church. We presume some folks found our stone as beautiful as we did and decided to abscond with it."] },
  { key:true, y:1929, t:["Session signs a $125,000 mortgage","in June. The stock market crashes","in October."], fx:{budget:-0.15}, page:"p.43-45", fact:["The Wall Street crash of October 1929 wiped out fortunes and tipped the United States into the Great Depression. The church had just signed a mortgage on its new Sanctuary, and Charlotte's banks and givers were badly hurt in the years that followed."] },

  { y:1937, t:["Session rules that men may remove","their suit coats in summer worship."], fx:{morale:3}, page:"p.123", fact:["Church was a very formal affair in the early days of the church. While we were unable to find any written dress code, we do find it interesting that the question of men's suit coats came before the Session of the church at all."] },

  { y:1945, t:["A Methodist neighbor fires a","homemade mortar at the church","and misses."], fx:{morale:2}, page:"p.99-101", fact:["Our neighbor at 1543 Queens Road had just returned from WWII with specific skills it seems he needed to continue to hone. His homemade mortar round remains the only known Methodist attack on the Presbyterians."] },

  { key:true, y:1963, t:["President Kennedy is shot.","More than a thousand people fill","the Sanctuary that day."], fx:{part:8,morale:-4}, page:"p.155", fact:["President John F. Kennedy was assassinated in Dallas on November 22, 1963. The nation came to a halt, and across the country churches opened their doors so people could gather to pray and grieve."], straight:true },
  { y:1966, t:["The Duke Mansion is left to the","church. It sells for $85,000."], fx:{budget:0.08}, page:"p.170", fact:["The mansion in Myers Park was the Charlotte home of tobacco and electric-power magnate James Buchanan Duke, who enlarged it to some forty-five rooms and signed the papers creating The Duke Endowment there in 1924. After passing through several owners it was restored in the 1990s and today operates as a historic inn."] },
  { y:1970, t:["The youth \"preachernap\" the associate","pastor from the Putt-Putt course."], fx:{morale:3,stam:-1}, page:"p.160", fact:["It's a true story: A group of MPPC Youth abducted their youth pastor and stuffed him in a car, presumably driven by a parent accomplice, driving around town before getting him out to see a big sign reading: \"We love you, Chuckie.\""] },
  { y:1975, t:["A purse thief keeps making off with","money from the choir room. Eventually","the locks are changed."], fx:{budget:-0.01,morale:-1}, page:"p.183", fact:["Thou shalt not steal."] },
  { y:1977, t:["You speak up for clemency for the","Wilmington Ten. Session holds a heated","meeting, and a few members withhold","their pledges in protest."], page:"p.204", fact:["The Wilmington Ten -- nine young Black men and one white woman, led by civil-rights organizer Ben Chavis -- were wrongfully convicted on arson and conspiracy charges after 1971 racial unrest in Wilmington, North Carolina. A federal court overturned the convictions in 1980, and the state formally pardoned the group in 2012."], straight:true, check:{stat:"g", pass:{msg:"You hear everyone out. They stay."}, fail:{budget:-0.05}} },
  { y:1982, t:["So many cars park on the neighbors' streets","that the police chief writes to the Session:","\"The tow-away signs mean what they say.\"","Parking continues to be challenging."], fx:{morale:-3}, page:"p.232", fact:["Many solutions have been proposed to alleviate the parking situation over the years. The most serious and best attempt, providing hundreds of spots at the Outreach Center, has been said to be \"not close enough.\""] },
  { y:1985, t:["A nine-year-old writes Session asking","for a gym. Session prices it out and","defers to the next building campaign."], fx:{morale:1}, page:"p.233-234", fact:["When you write a note to Session, they read it!"] },
  // Big steeple, big weather
  { y:1987, t:["You are called to MPPC by a vote of","619 to 2. You wonder about the two."], fx:{morale:5}, page:"p.239", fact:["Most congregational votes are unanimous, but for reasons lost to time, this one was not."] },
  { key:true, y:1989, t:["Hurricane Hugo. Trees down, power out","for weeks, and the church holds a","relief breakfast in the gym."], fx:{part:-6,budget:-0.04,morale:3,energy:-8}, page:"p.258-260", fact:["Hurricane Hugo struck the Carolina coast as a Category 4 storm in September 1989 and, unusually, stayed powerful far inland. It battered Charlotte through the night, downing tens of thousands of trees and cutting power across the city for weeks."] },
  { y:1991, t:["You form an AIDS Task Force when no","one, \"especially the big steeple","churches,\" would."], page:"p.269-270", fact:["By the early 1990s AIDS had become a leading cause of death for young adults in America, and the epidemic was deepened by fear and stigma. Many large congregations kept their distance, so a church that formed a task force to respond was doing something few 'big steeple' churches would."], check:{stat:"c", pass:{morale:8}, fail:{morale:4,members:-0.01}} },
  { y:1993, t:["Members pledge 125,000 volunteer hours","and millions of dollars in a campaign.","Session lets out un-Presbyterian","whoops of joy."], fx:{part:12,budget:0.05}, page:"p.274" },
  { y:[1988,1995], t:["Session asks what God created on","the seventh day. You answer:","\"The Winston Cup.\""], fx:{morale:3,part:3}, page:"p.277-279", fact:["Tim Croft was a huge NASCAR fan. When a 1971 federal law banned cigarette ads on television, the R.J. Reynolds Tobacco Company shifted its money into motorsports and lent NASCAR's top series the name of its Winston brand. The Winston Cup was stock-car racing's premier championship from 1971 until 2003."] },
  { y:1996, t:["You preach from the floor instead of","the pulpit. The Charlotte Observer","writes about the departure in decorum."], page:"p.286", check:{stat:"p", pass:{morale:6}, fail:{morale:-6}} },
  { y:2002, t:["The Celebrate service launches on","tarps in the gym. Three hundred","people show up."], fx:{members:0.02,part:8}, page:"p.312-314", fact:["The Celebrate service began not at a pastor's direction but during an interim period, when there was no head of staff pastor at all."] },
  { key:true, y:2008, t:["It's the Great Recession :( You need","$1.6M in December. Cut the free","coffee to save $17,000?"], page:"p.339-340",
    fact:["In December 2008, as the financial crisis unfolded, the church still needed one point six million dollars for its annual budget. One cost-cutting idea on the table was to stop giving away coffee, saving about seventeen thousand dollars a year.","Through it all, the church held the line to protect its outreach support."],
    choice:[{label:"Cut the coffee",fx:{budget:0.03,morale:-6,msg:"We're less caffeinated, but outreach funding is not cut."}},{label:"Keep the coffee",fx:{budget:-0.03,morale:1}}] },
  { key:true, y:2011, t:["The denomination ends its ban on","LGBTQIA+ clergy and lay leaders.","Some members leave. Others who","disagreed stay."], fx:{members:-0.01}, page:"p.311-312", fact:["In 2011 the Presbyterian Church (U.S.A.) ratified 'Amendment 10-A,' removing the constitutional barrier to ordaining gay and lesbian clergy and lay leaders. The change let each presbytery and congregation decide for itself, and it took effect that July."], straight:true },
  { key:true, y:2015, t:["The denomination has redefined","marriage. Hold a town hall and","update the wedding policy?"], page:"p.367-368", straight:true,
    fact:["In 2015, after the denomination changed its definition of marriage, the Session held a town hall and several listening sessions before amending the church's wedding policy to include people of all genders.","Some families left and annual giving declined for a time."],
    choice:[{label:"Hold the town hall, update it",fx:{morale:6,members:-0.02,budget:-0.03,msg:"Giving recovers in 18 months."}},{label:"Keep the old policy",fx:{morale:-6,part:-6}},{label:"Delay a year",fx:{morale:-4,msg:"It isn't going away."}}] },
  // Pandemic and centennial
  { y:2016, t:["Your first Sunday in the pulpit at MPPC","is September 11. Nine days later,","unrest downtown. Join the march?"], page:"p.379", fact:["In September 2016 the police shooting of Keith Lamont Scott set off days of protest in Charlotte. The governor declared a state of emergency and the city set a curfew; later marches were largely peaceful as demonstrators called for the release of police video."], straight:true,
    choice:[{label:"Go",check:{stat:"g",pass:{morale:4},fail:{morale:-2}}},{label:"Stay",fx:{morale:-2}}] },
  { y:2023, t:["Tuesdays Together launches for the","over-60 crowd. One hundred come the","first night. The speaker is the one","and only Joe Clifford."], fx:{part:10,morale:3}, page:"p.415" },
  { key:true, y:2020, t:["COVID-19 hits. Worship goes online.","Staff are furloughed. A Zoom morning","prayer begins and continues on","weekday mornings even now."], fx:{part:-25,budget:-0.05}, page:"p.394-400", fact:["The World Health Organization declared COVID-19 a pandemic in March 2020, and gatherings of every kind shut down. Churches moved worship online almost overnight -- a single Sunday might have a few dozen people in the building and hundreds more watching from home."], straight:true },
  { y:2022, t:["The new organist plays so loudly","he knocks pictures off the walls."], fx:{morale:4}, page:"p.411", fact:["Tom Robak began as our organist in 2022, and during a particularly robust practice session, rattled the walls of the chancel so much the photos on the other side slipped off of their nails and crashed to the floor."] },
  { y:2024, t:["Hurricane Helene devastates much of","western North Carolina. The church","houses displaced volunteers and","sends $125,000 in relief."], fx:{part:6,morale:5,budget:-0.02}, page:"p.415-416", fact:["Hurricane Helene came ashore in Florida in late September 2024 and pushed inland, dropping catastrophic rain on the southern Appalachians. Western North Carolina around Asheville was hit especially hard, and churches across the state sent volunteers and relief."] },
  // Any era, real
  { y:"any", t:["Hugh McManaway is directing traffic","at Providence and Queens again."], page:"p.40, 94-96", fact:["Hugh McManaway was a Charlotte eccentric who for years stood at Providence and Queens Roads, near the church, cheerfully 'directing' the traffic with a towel tucked under his arm. A bronze statue of him was placed at the intersection in 2000, and neighbors still dress it up for weddings and graduations."], hugh:true },
  { y:"any", t:["A family arrives for a funeral.","Wrong church. The Baptists are","down the street."], fx:{morale:2}, page:"p.250", fact:["Our church is often confused for other churches in the neighborhood."] },

// ===== engine.js =====
// ============================================================
// ENGINE: scaling, input, screens, timers, sound, storage
// ============================================================
const KIOSK_ATTRACT_MS = 120000;  // idle on title -> attract mode (2 min)
const KIOSK_RESET_MS   = 300000;  // idle in game -> back to title (5 min)

const E = {
  screen:null, screens:{}, last:0, idle:0, hot:[], scale:1, offX:0, offY:0, running:false,
  init(){
    G.init(document.getElementById("game"));
    this.resize(); window.addEventListener("resize",()=>this.resize());
    const cv=G.cv;
    cv.addEventListener("pointerdown",e=>{ e.preventDefault(); const p=this.pt(e); this.idle=0; Sound.unlock(); this.tap(p.x,p.y,e.pointerId); },{passive:false});
    cv.addEventListener("pointermove",e=>{ const p=this.pt(e); if(this.screen&&this.screen.move) this.screen.move(p.x,p.y,e.buttons>0||e.pointerType==="touch"); });
    cv.addEventListener("pointerup",e=>{ Sound.unlock(); const p=this.pt(e); if(this.screen&&this.screen.up) this.screen.up(p.x,p.y); });
    cv.addEventListener("pointercancel",e=>{ if(this.screen&&this.screen.up) this.screen.up(-1,-1); });
    window.addEventListener("keydown",e=>{ this.idle=0; if(this.screen&&this.screen.key) this.screen.key(e.key,e); if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault(); });
    window.addEventListener("keyup",e=>{ if(this.screen&&this.screen.keyup) this.screen.keyup(e.key,e); });
    this.running=true; requestAnimationFrame(t=>this.loop(t));
  },
  resize(){
    const ww=window.innerWidth, wh=window.innerHeight; const s=Math.min(ww/G.W, wh/G.H);
    this.scale=s; G.cv.style.width=(G.W*s)+"px"; G.cv.style.height=(G.H*s)+"px";
    const r=G.cv.getBoundingClientRect(); this.offX=r.left; this.offY=r.top;
  },
  pt(e){ const r=G.cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/this.scale, y:(e.clientY-r.top)/this.scale }; },
  now(){ return typeof performance!=="undefined"?performance.now():Date.now(); },
  lock(ms){ this.lockUntil=this.now()+(ms||300); },
  go(name,arg){ const s=this.screens[name]; if(!s) throw new Error("no screen "+name); this.hot=[]; this.screen=s; this.screenName=name; this.idle=0; this.lock(); if(s.enter) s.enter(arg); },
  loop(t){ const dt=Math.min(0.1,(t-this.last)/1000||0); this.last=t; this.idle+=dt*1000;
    if(this.screen){ if(this.screen.update) this.screen.update(dt); this.hot=[]; this.screen.draw(dt); }
    if(this.screenName==="title" && this.idle>KIOSK_ATTRACT_MS) this.go("attract");
    else if(this.screenName!=="title" && this.screenName!=="attract" && this.screenName!=="leaderboard" && this.idle>KIOSK_RESET_MS){
      if(S && !S.over && !S.reached2026 && !S._endLogged){ S._endLogged=true; track("session_end",endRow("abandoned")); }
      this.go("title"); }
    requestAnimationFrame(t2=>this.loop(t2)); },
  // hot zones: registered during draw, consumed on tap
  zone(x,y,w,h,fn,key){ this.hot.push({x,y,w,h,fn,key}); },
  tap(x,y,id){
    // hidden debug gesture: 5 quick taps in the top-right corner opens the playtest menu
    const now=this.now();
    if(this.screenName==="title"&&x>=600&&y<=22){ if(now-(this._dbgT||0)>1500) this._dbgN=0; this._dbgT=now; this._dbgN=(this._dbgN||0)+1; if(this._dbgN>=5){ this._dbgN=0; this.go("debug"); return; } } else { this._dbgN=0; }
    if(now<(this.lockUntil||0)) return;
    if(this.screen&&this.screen.tap&&this.screen.tap(x,y,id)===true) return; for(const z of this.hot){ if(x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h){ Sound.click(); z.fn(); return; } } },
  keyMenu(k){ for(const z of this.hot){ if(z.key!=null && String(z.key)===k){ Sound.click(); z.fn(); return true; } } return false; },

  // ----- widgets -----
  // menu rows: items [{label, fn, dim, sub, tag, selected, color}]. Numbered unless opts.keys gives letters. Returns the y below the menu.
  menu(items,x,y,w,opts){ opts=opts||{}; const sub=items.some(it=>it.sub); const rowH=opts.rowH||(sub?36:28); const gap=4; const scale=opts.scale||T.M;
    items.forEach((it,i)=>{ const yy=y+i*rowH; const h=rowH-gap; const key=opts.keys?opts.keys[i]:String(i+1); const label=(opts.numbered===false?"":key.toUpperCase()+". ")+it.label;
      const fill=it.dim?C.PANEL:(it.selected?C.SELECT:(it.color!=null?it.color:C.MENU)); G.rect(x,yy,w,h,fill); G.frame(x,yy,w,h,it.dim?C.GOLD_INK:(it.selected?C.CLAY_LIGHT:C.FRAME),1);
      const col=it.dim?C.GOLD_INK:C.TEXT; const ty=sub?yy+5:yy+Math.round((h-7*scale)/2);
      G.text(label,x+10,ty,col,scale); if(it.selected) G.rtext("<",x+w-8,ty,C.PAPER,scale);
      if(it.sub){ const sls=G.wrap(it.sub,T.S,w-16), sc2=it.dim?C.GOLD_INK:C.GOLD_PALE, sy0=yy+h-13-(sls.length-1)*10; sls.forEach((ln,j)=>G.text(ln,x+10,sy0+j*10,sc2,T.S)); }
      if(it.tag&&!it.selected) G.rtext(it.tag,x+w-8,sub?yy+5:ty+2,it.dim?C.GOLD_INK:C.GOLD_LIGHT,T.S);
      if(!it.dim) this.zone(x,yy,w,h,it.fn,key.length===1?key.toLowerCase():key); });
    return y+items.length*rowH; },
  // single big button
  button(label,x,y,w,h,fn,key,color){ G.rect(x,y,w,h,color==null?C.MENU:color); G.frame(x,y,w,h,C.FRAME,2); G.ctext(label,x+w/2,y+Math.round((h-10.5)/2),C.TEXT,T.M); this.zone(x,y,w,h,fn,key); },
  // "Tap to continue" strip at the bottom; the whole screen is the zone
  pressBar(label,fn){ const l=label||"Tap to continue"; G.rect(0,372,640,28,C.MENU); G.rect(0,372,640,2,C.FRAME); G.ctext(l,320,381,C.PAPER,T.M); this.zone(0,0,640,400,fn,"Enter"); this.zone(0,0,640,400,fn," "); },
  // Status strip, y 0..28: year, then five bars that change colour as they fall
  statusBar(){ const s=S; G.rect(0,0,640,28,C.BG); G.rect(0,27,640,1,C.GOLD_INK);
    G.text(String(s.year),6,6,C.TITLE,T.L);
    const exp=lerpAnchors(DATA.memberAnchors,s.year);
    const cells=[
      ["FUNDS","$"+fmtMoney(s.budgetDollars()),clamp(s.budget,0,1.5)/1.5,G.level(s.budget,0.6,0.3)],
      ["MEMBERS",String(Math.round(s.members)),clamp(s.members/exp,0,1),G.level(s.members/exp,0.8,0.5)],
      ["MORALE",String(Math.round(s.morale)),s.morale/100,G.level(s.morale/100,0.5,0.3)],
      ["PARTICIPATION",String(Math.round(s.part)),s.part/100,G.level(s.part/100,0.4,0.2)],
      ["STAMINA",String(Math.round(s.stam)),s.stam/100,G.level(s.stam/100,0.5,0.3)]
    ];
    cells.forEach((c,i)=>{ const x=66+i*115, w=108; G.text(c[0],x,4,C.DIM,T.S); G.rtext(c[1],x+w,4,C.TEXT,T.S); G.bar(x,14,w,8,c[2],c[3]); }); }
};

function fmtMoney(n){ n=Math.round(n); if(Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+"M"; return n.toLocaleString("en-US"); }
function lerpAnchors(anchors,year){ if(year<=anchors[0][0]) return anchors[0][1]; for(let i=1;i<anchors.length;i++){ if(year<=anchors[i][0]){ const [y0,v0]=anchors[i-1],[y1,v1]=anchors[i]; const f=(year-y0)/(y1-y0); return Math.exp(Math.log(v0)+(Math.log(v1)-Math.log(v0))*f); } } return anchors[anchors.length-1][1]; }
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[rnd(a.length)]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// ----- SOUND (WebAudio) -----
const Sound = {
  ctx:null, level:0, levels:[0,0.08,0.25], hymnTimer:null,
  unlock(){ const fresh=!this.ctx; if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state!=="running"){ try{ this.ctx.resume(); }catch(e){} }
    if(fresh && this.musicOn){ if(this.musicTimer) clearTimeout(this.musicTimer); this._killMusic(); this._musicStep(); } },
  cycle(){ this.level=(this.level+1)%3; try{ localStorage.setItem("mpt_sound",String(this.level)); }catch(e){} if(this.level) this.beep(880,0.05); else this._killMusic();
    if(this.level && this.musicOn){ if(this.musicTimer) clearTimeout(this.musicTimer); this._killMusic(); this._musicStep(); } },
  load(){ try{ const v=localStorage.getItem("mpt_sound"); this.level=(v==null)?1:(parseInt(v)||0); }catch(e){ this.level=1; } },
  label(){ return ["Sound: off","Sound: low","Sound: high"][this.level]; },
  tone(freq,dur,when,type){ if(!this.ctx||!this.level) return; const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type=type||"square"; o.frequency.value=freq; g.gain.value=this.levels[this.level]; o.connect(g); g.connect(this.ctx.destination); const t=when||this.ctx.currentTime; o.start(t); g.gain.setValueAtTime(this.levels[this.level],t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.stop(t+dur+0.02); },
  beep(f,d){ this.tone(f||660,d||0.06); },
  click(){ this.tone(520,0.03); },
  good(){ this.tone(660,0.08); this.tone(880,0.1,this.ctx?this.ctx.currentTime+0.09:0); },
  bad(){ this.tone(220,0.15); this.tone(180,0.2,this.ctx?this.ctx.currentTime+0.14:0); },
  catchCard(){ this.tone(990,0.05); },
  firework(){ const t=this.ctx?this.ctx.currentTime:0; this.tone(140,0.05,t,"square"); this.tone(760+Math.random()*420,0.16,t+0.03,"triangle"); },
  hymn(){ if(!this.ctx||!this.level) return; const bpm=96; let t=this.ctx.currentTime+0.05, total=0.05; DATA.hymn.forEach(([n,b])=>{ const f=440*Math.pow(2,(n-69)/12); const d=b*60/bpm; this.tone(f,d*0.9,t,"triangle"); t+=d; total+=d; });
    // hush the looping background music while the fanfare plays, so the two tunes don't overlap (and the loop doesn't bleed into the next screen on top of it)
    if(this.musicOn){ if(this.musicTimer) clearTimeout(this.musicTimer); this._killMusic(); this.musicTimer=setTimeout(()=>this._musicStep(), total*1000+800); } },
  // Continuous, gentle background music: cycles through DATA.hymns on every screen. Silent when sound is off; harmless until audio is unlocked.
  musicOn:false, musicIdx:0, musicTimer:null, musicOsc:[],
  startMusic(){ if(this.musicOn) return; this.musicOn=true; this._musicStep(); },
  stopMusic(){ this.musicOn=false; if(this.musicTimer){ clearTimeout(this.musicTimer); this.musicTimer=null; } this._killMusic(); },
  _killMusic(){ (this.musicOsc||[]).forEach(o=>{ try{ o.stop(); }catch(e){} }); this.musicOsc=[]; },
  _musicStep(){ if(!this.musicOn) return; const set=(DATA.hymns&&DATA.hymns.length)?DATA.hymns:[DATA.hymn]; const tune=set[this.musicIdx%set.length]; this.musicIdx++; const dur=this._playTune(tune,0.38); this.musicTimer=setTimeout(()=>this._musicStep(), Math.max(1,dur)*1000+2800); },
  _playTune(tune,gm){ this._killMusic(); const bpm=90; if(!this.ctx||!this.level){ let s=0; tune.forEach(nb=>s+=nb[1]*60/bpm); return s; }
    let t=this.ctx.currentTime+0.15; const g0=this.levels[this.level]*(gm||1); this.musicOsc=[];
    tune.forEach(([n,b])=>{ const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type="triangle"; o.frequency.value=440*Math.pow(2,(n-69)/12); o.connect(g); g.connect(this.ctx.destination); const d=b*60/bpm;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(g0,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+d*0.9); o.start(t); o.stop(t+d+0.02); this.musicOsc.push(o); t+=d; });
    return t-this.ctx.currentTime; }
};

// ----- LOGGING to a Google Sheet via Apps Script (queued offline, flushed when online) -----
const Log = {
  queue:[], busy:false, device:null,
  init(){ try{ this.queue=JSON.parse(localStorage.getItem("mpt_queue")||"[]"); this.device=localStorage.getItem("mpt_device"); if(!this.device){ this.device=Math.random().toString(36).slice(2,10); localStorage.setItem("mpt_device",this.device); } }catch(e){ this.queue=[]; this.device="anon"; }
    window.addEventListener("online",()=>this.flush()); setInterval(()=>this.flush(),30000); this.flush(); },
  save(){ try{ localStorage.setItem("mpt_queue",JSON.stringify(this.queue.slice(-500))); }catch(e){} },
  send(ev,data){ if(!DATA.config||!DATA.config.sheetUrl) return; const row=Object.assign({event:ev,client_time:new Date().toISOString(),device:this.device,build:DATA.config.build||"kiosk"},data||{}); this.queue.push(row); this.save(); this.flush(); },
  flush(){ if(this.busy||!this.queue.length||!DATA.config||!DATA.config.sheetUrl||(typeof navigator!=="undefined"&&navigator.onLine===false)) return; const batch=this.queue.slice(0,50); this.busy=true;
    fetch(DATA.config.sheetUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(batch)}).then(()=>{ this.queue=this.queue.slice(batch.length); this.save(); this.busy=false; if(this.queue.length) setTimeout(()=>this.flush(),500); }).catch(()=>{ this.busy=false; }); }
};
function track(ev,params){ try{ if(typeof S!=="undefined"&&S&&S.debug) return; Log.send(ev,params); }catch(e){} }

function newGame(pastor, trailLen){
  const lm = DATA.trail.filter(t => trailLen==="long" || t.short);
  S = {
    pastor, trailLen, landmarks:lm, li:0, year:1926,
    budget:1.0, members:245, morale: pastor.id==="gammon"?90:70, part:50, stam: 50+pastor.s*5,
    party: pastor.party.map(([name,role])=>({name,role,energy:100,ailment:null,gone:false,k:0.6+Math.random()*0.8})),
    rider: pastor.rider||null, riderUsed:false,
    pace:"ordinary", rations:"potluck",
    used:new Set(), cash:0, borrowed:0, debtYears:0,
    driveLandmark:-1, restLandmark:-1, drivesDecade:{}, hymnDecade:{}, boilerDone:false, moderatorDone:false, presbyDone:{},
    eventsSeen:0, log:[], sinceEvent:9, startedAt:Date.now(), reached2026:false, over:null, travelOff:0
  };
  S.budgetDollars = function(){ return this.budget*lerpAnchors(DATA.budgetAnchors,this.year); };
  S.session=Math.random().toString(36).slice(2,10); Store.stat("plays"); track("session_start",{session:S.session,pastor:pastor.id,trail:trailLen});
}
function stat(k){ return S.pastor[k]; }
function roll(statKey){ if(S.pastor.id==="calvin") return true; return (rnd(10)+1) <= stat(statKey); }
function partyAlive(){ return S.party.filter(p=>!p.gone); }
function decade(){ return Math.floor(S.year/10); }

function applyFx(fx, ctx){
  const out=[]; if(!fx) return out; ctx=ctx||{};
  const sermon = ctx.sermon && S.pastor.id==="swicegood" ? 2 : 1;
  if(fx.budget){ let b=fx.budget; if(S.pastor.id==="clifford" && b>0 && ctx.outreach) b*=1.5; S.budget+=b*sermon; out.push("Funds "+(b>0?"+":"")+Math.round(b*100)+"%"); }
  if(fx.members){ if(typeof fx.members==="object"){ S.members+=fx.members.n; out.push("Members "+(fx.members.n>0?"+":"")+fx.members.n); } else { let m=fx.members; if(m<0 && S.pastor.c>=9) m*=0.5; S.members*=1+m; out.push("Members "+(m>0?"+":"")+Math.round(m*100)+"%"); } }
  if(fx.morale){ let m=fx.morale*sermon; if(m<0 && S.pastor.id==="eason") m=Math.round(m/2); S.morale=clamp(S.morale+m,0,100); out.push("Morale "+(m>0?"+":"")+m); }
  if(fx.part){ S.part=clamp(S.part+fx.part,0,100); out.push("Participation "+(fx.part>0?"+":"")+fx.part); }
  if(fx.stam){ let s=fx.stam; if(s<0 && S.pastor.id==="gammon") s*=2; S.stam=clamp(S.stam+s*3,0,100); out.push("Stamina "+(s>0?"+":"")+(s*3)); }
  if(fx.energy){ S.party.forEach(p=>{ if(!p.gone) p.energy=clamp(p.energy+fx.energy,0,100); }); out.push("Leaders' energy "+(fx.energy>0?"+":"")+fx.energy); }
  if(fx.msg) out.push(fx.msg);
  return out;
}

// ---- yearly simulation ----
// aim = member target vs history; ptgt/mtgt = the participation/morale the church drifts toward;
// drain = pastor stamina lost per year (scaled by the Stamina stat); energy = leaders per year; drive = pledge-card value
function paceMods(){ return {
  sabbath: {aim:0.90, ptgt:60, mtgt:72, drain:0.20, energy:-0.3, cost:0,     drive:1.0},
  ordinary:{aim:1.00, ptgt:50, mtgt:62, drain:0.50, energy:-0.8, cost:0,     drive:1.0},
  growth:  {aim:1.15, ptgt:42, mtgt:52, drain:1.00, energy:-1.6, cost:0.005, drive:1.35} }[S.pace]; }
function rationMods(){ return {
  catered:{budget:-0.003, morale:14,  part:0,  drain:-0.15},
  potluck:{budget:0,      morale:0,   part:6,  drain:0},
  coffee: {budget:0.010,  morale:-18, part:-4, drain:0.10} }[S.rations]; }
// a typical year's giving, as a fraction of a healthy year's reserves (expenses are 0.05). The long trail has more
// stops to hold drives at, so it gives a little less.
const GIVE_BASE={short:0.049,long:0.044};
function stamMult(){ return clamp(1.6-0.1*S.pastor.s,0.6,1.5); }   // Stamina stat 2 -> x1.4, 4 -> x1.2, 7 -> x0.9, 10 -> x0.6
function advanceYear(){
  const pm=paceMods(), rm=rationMods(); S.year++; if(S.year>2026)S.year=2026;
  const curAnchor = lerpAnchors(DATA.memberAnchors,S.year), prevAnchor = lerpAnchors(DATA.memberAnchors,S.year-1);
  // follow history's year-over-year slope, then ease toward a pace-dependent multiple of the
  // historical size so the congregation stays grounded in the real numbers instead of ballooning.
  let rate = (curAnchor/prevAnchor - 1) + (curAnchor*pm.aim - S.members)/S.members*0.30;
  if(S.morale<40) rate-=0.01; if(S.morale>80) rate+=0.002; if(S.part<20) rate-=0.02;
  S.members = Math.max(0, S.members*(1+rate));
  // giving scales with the size of the roll vs history, so Members matter and Growth pays
  const giving = GIVE_BASE[S.trailLen]*(0.5+0.5*S.part/50)*(0.6+0.4*S.morale/70)*(S.members/curAnchor); const expenses = 0.05 + pm.cost + (S.debtYears>0?0.02:0);
  S.budget += giving - expenses + rm.budget; if(S.debtYears>0) S.debtYears--;
  if(S.budget>1.5){ S.budget=1.5; S.morale=clamp(S.morale+1,0,100); }
  S.negYears = S.budget<0 ? (S.negYears||0)+1 : 0;
  S.morale = clamp(S.morale + (pm.mtgt+rm.morale-S.morale)*0.08, 0, 100);
  S.part   = clamp(S.part   + (pm.ptgt+rm.part-S.part)*0.06, 0, 100);
  // the pastor always gets a little more tired: pace sets how fast, the Stamina stat scales it, catered suppers help
  S.stam = clamp(S.stam - Math.max(0.1, pm.drain*stamMult()+rm.drain), 0, 100);
  S.party.forEach(p=>{ if(p.gone) return; p.energy=clamp(p.energy+(pm.energy<0?pm.energy*p.k:pm.energy),0,100);
    if(!p.ailment && p.energy<45 && Math.random()<0.08){ p.ailment=pick(DATA.ailments); S.log.push(p.name+" has "+p.ailment+"."); }
    if(p.ailment && p.energy>60 && Math.random()<0.4){ S.log.push(p.name+" recovered from "+p.ailment+"."); p.ailment=null; }
    if(p.ailment) p.energy=clamp(p.energy-1.5,0,100);
    if(p.energy<=0){ p.gone=true; p.ailment=null; S.log.push(p.name+" "+pick(DATA.departures)); if(S.pastor.id!=="croft") S.members*=0.95; } });
  if(S.pastor.id==="jones" && Math.random()<0.06){ const d=(rnd(7)-3)/100; S.budget+=d; S.log.push("Session voted something while you were away. Funds "+(d>=0?"+":"")+Math.round(d*100)+"%."); }
  checkOver();
}
function checkOver(){
  if(S.over) return S.over;
  if(S.negYears>=2) S.over="budget";
  else if(S.members<100) S.over="members";
  else if(S.morale<=0) S.over="morale";
  else if(S.stam<=0) S.over="stamina";
  else if(partyAlive().length===0) S.over="party";
  return S.over;
}
function pickEvent(){
  const long=S.trailLen==="long";
  const specific = DATA.events.filter((e,i)=>!S.used.has(i) && typeof e.y==="number" && e.y===S.year);
  if(specific.length && Math.random()<(long?1:0.6)){ const e=pick(specific); S.used.add(DATA.events.indexOf(e)); return e; }
  const rate = long?0.11:0.07; if(Math.random()>rate) return null;
  const pool = DATA.events.filter((e,i)=>!S.used.has(i) && (e.y==="any" || (Array.isArray(e.y)&&S.year>=e.y[0]&&S.year<=e.y[1])));
  if(!pool.length) return null; const e=pick(pool); S.used.add(DATA.events.indexOf(e)); return e;
}
// events tied to a real year fire reliably, on that year (history should not be skipped)
// (a landmark arrival or the calm stretch can swallow an event's exact year, so overdue ones still fire, up to 6 years late, oldest first)
// The short trail can't fit every dated event, so key:true events (data.js) jump the queue.
// HIST_LATE: how many years late an ordinary dated event may still fire (the short trail keeps to exact years so it stays ~6 minutes)
const HIST_LATE={short:0,long:2}, HIST_LATE_KEY=12, PRESBY_LATE={short:1,long:2};
function dueSpecific(){ const s=DATA.events.filter((e,i)=>!S.used.has(i) && typeof e.y==="number" && e.y<=S.year && e.y>=S.year-(e.key?HIST_LATE_KEY:HIST_LATE[S.trailLen])); if(!s.length) return null; s.sort((a,b)=>((b.key?1:0)-(a.key?1:0))||(a.y-b.y)); const e=s[0]; S.used.add(DATA.events.indexOf(e)); return e; }
// ambient / colour events: only sometimes, and only when the pacing allows
function pickAmbient(){ const long=S.trailLen==="long"; const rate=long?0.11:0.07; if(Math.random()>rate) return null; const pool=DATA.events.filter((e,i)=>!S.used.has(i) && (e.y==="any" || (Array.isArray(e.y)&&S.year>=e.y[0]&&S.year<=e.y[1]))); if(!pool.length) return null; const e=pick(pool); S.used.add(DATA.events.indexOf(e)); return e; }
function endRow(outcome){ const sc=score().total; return { session:S.session, pastor:S.pastor.id, trail:S.trailLen, outcome, year:S.year, score:sc, members:Math.round(S.members), budget_pct:Math.round(S.budget*100), morale:Math.round(S.morale), participation:Math.round(S.part), stamina:Math.round(S.stam), party_aboard:partyAlive().length, drives:S.drives||0, cash_campaigns:S.cash, borrowed:S.borrowed, events_seen:S.eventsSeen, minutes:Math.round((Date.now()-S.startedAt)/6000)/10 }; }
function score(){
  const s=S; const cashN=s.cash, borN=s.borrowed;
  const parts=[["Members",Math.round(s.members/5)],["Funds",Math.round(s.budget*950)],["Morale",Math.round(s.morale*5)],["Participation",Math.round(s.part*2)],["Leaders aboard",partyAlive().length*300],["Campaigns paid in cash",cashN*500],["Campaigns borrowed",borN*200],["Reached 2026",s.reached2026?1000:0]];
  const raw=Math.max(0,parts.reduce((a,p)=>a+p[1],0)), mult=s.pastor.mult==null?1:s.pastor.mult;
  return { total:Math.round(raw*mult), raw, mult, parts };
}
// a low-stat nudge for the landmark screen, or null
function lowHint(){
  if(S.budget<0.45) return { stat:"Funds", act:"Hold a stewardship drive to bring in pledges." };
  if(S.stam<35) return { stat:"Stamina", act:"Rest a year to recover before you run out." };
  if(partyAlive().some(p=>p.energy<30)) return { stat:"Leaders' energy", act:"Rest a year so your leaders can recover." };
  if(S.morale<35) return { stat:"Morale", act:"Rest a year, or try catered suppers." };
  if(S.part<25) return { stat:"Participation", act:"A stewardship drive lifts participation too." };
  return null;
}

SC.travel = {
  acc:0, enter(){ this.acc=0; this.calm=3.0; this.msg=null; this.msgT=0; this.perYear=this.segPace(); },
  // Each leg of the trip takes at least a few seconds of travel, no matter how close two
  // landmark years are, so closely-dated stops never stack up back to back.
  segPace(){ const nx=S.landmarks[S.li+1]; const span=nx?Math.max(1,nx.year-S.year):1;
    // ~2x the old timings so each leg is a visibly longer stretch of road between stops
    const base=S.trailLen==="long"?0.90:0.64, minSeg=S.trailLen==="long"?11:9, pyMax=S.trailLen==="long"?6.4:5.2;
    return clamp(minSeg/span, base, pyMax); },
  update(dt){ if(S.over){ E.go("gameover"); return; } const perYear=this.perYear||this.segPace(); this.acc+=dt; if(this.calm>0) this.calm-=dt; S.sinceEvent+=dt; S.travelOff+=dt*120;
    if(this.msgT>0){ this.msgT-=dt; return; }
    if(this.acc>=perYear){ this.acc=0; this.step(); } },
  step(){
    const next=S.landmarks[S.li+1]; if(!next) return;
    advanceYear();
    if(S.over){ E.go("gameover"); return; }
    if(S.year>=next.year){ S.li++; E.go(next.type==="cross"?"crossing":(next.type==="end"?"finale":"landmark"), next); return; }
    // breathing room: a calm stretch right after every stop, then spacing between interruptions
    const cool = S.trailLen==="long"?3.5:3.0;
    if(this.calm>0 || S.sinceEvent<cool || next.year-S.year<=1) return;
    // the first time funds run low, Session calls a stewardship drive so every player learns how to raise money
    if(!S.taughtDrive && S.budget<0.45 && S.driveLandmark!==S.li){ S.taughtDrive=true; S.sinceEvent=0; E.go("drive",{back:"travel",forced:true}); return; }
    const wf=DATA.windfall; if(wf && !S.windfallDone && S.year>=wf.fromYear && S.budget<wf.below){ S.windfallDone=true; S.sinceEvent=0; E.go("event",{ev:wf}); return; }
    // news about your leaders first (a short notice, not a screen)
    if(S.log.length){ this.msg=S.log.shift(); this.msgT=1.8; S.sinceEvent=0; Sound.bad(); return; }
    // Presbytery meets in its decade's year, or soon after if history was in the way
    const py=DATA.presbyteryYears.find(y=>S.year>=y && S.year<=y+PRESBY_LATE[S.trailLen] && !S.presbyDone[y]); if(py && next.year-S.year>2){ S.presbyDone[py]=true; S.sinceEvent=0; E.go("presbytery"); return; }
    // Taylor's year as Moderator
    if(S.pastor.id==="taylor" && S.year>=1983 && S.year<=1987 && !S.moderatorDone){ S.moderatorDone=true; S.sinceEvent=0; E.go("event",{ev:{y:1983,t:["You are elected Moderator of the","reunited church and spend a year","on the road."],fx:{budget:(rnd(21)-10)/100,morale:rnd(21)-10,stam:-2},page:"p.219-231"}}); return; }
    // events tied to a real year fire on (or, if a stop swallowed that year, soon after) that year
    const sp=dueSpecific(); if(sp){ S.sinceEvent=0; E.go("event",{ev:sp}); return; }
    // colour events keep clear of the next milestone
    if(next.year-S.year<=2) return;
    const ev=pickAmbient(); if(ev){ if(ev.invented && S.rider && !S.riderUsed){ S.riderUsed=true; this.msg="Jennifer quietly handled a crisis."; this.msgT=1.8; S.sinceEvent=0; Sound.good(); return; } S.sinceEvent=0; E.go("event",{ev}); }
  },
  draw(){ drawTravelScene(S.year,S.travelOff,true); G.draw(ART.bus,100,224,2); drawBusRiders(100,224,2);
    E.statusBar();
    G.rect(0,295,640,105,C.PANEL); G.rect(0,295,640,2,C.FRAME);
    const next=S.landmarks[S.li+1]; G.text("Next: "+(next?next.name+" ("+next.year+")":"Centennial Sunday"),12,310,C.TEXT,T.M);
    G.text("Pace: "+paceName(S.pace)+"    Suppers: "+rationName(S.rations),12,330,C.DIM,T.S);
    const ill=partyAlive().some(p=>p.ailment); G.text("Leaders: "+partyAlive().map(p=>(p.name.split(" ").find(w=>!/^[A-Z]\.$/.test(w))||p.name)+(p.ailment?"*":"")).join(", ")+(ill?"   (* = unwell)":""),12,348,C.DIM,T.S);
    const hint=lowHint(); if(hint){ const act=hint.act.replace(/\..*/,"."), verb=hint.stat==="Funds"?"are":"is"; G.text(hint.stat+" "+verb+" low. Tap Stop, then "+act.charAt(0).toLowerCase()+act.slice(1),12,368,C.WARN,T.S); }
    if(this.msg){ G.box2(60,180,520,40,C.PANEL,C.TITLE); G.cpara(this.msg,320,192,C.TITLE,T.M,500); }
    E.button("Stop",524,364,104,28,()=>E.go("landmark",{stop:true}),"Escape",C.STONE); },
  key(k){ E.keyMenu(k); }

    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ"; for(let i=0;i<26;i++){ const col=i%9,row=Math.floor(i/9); const x=70+col*56, y=120+row*52; G.rect(x,y,48,44,C.MENU); G.frame(x,y,48,44,C.FRAME,1); G.ctext(letters[i],x+24,y+14,C.TEXT,T.L); E.zone(x,y,48,44,()=>{ if(this.s.length<3) this.s+=letters[i]; },letters[i].toLowerCase()); }
    E.button("DEL",70+8*56,120+2*52,48,44,()=>{ this.s=this.s.slice(0,-1); },"Backspace",C.CLAY_INK);
    E.button("DONE",240,290,160,44,()=>this.done(),"Enter",C.SAGE_INK); },
  done(){ if(!this.s.length) this.s="MPP"; const sc=score().total; const hi=Store.addScore(this.s.padEnd(3,"-"),sc,S.pastor.short); track("initials",{session:S.session,pastor:S.pastor.id,score:sc,initials:this.s}); E.go("leaderboard",{hi}); },
  key(k){ if(k.length===1 && /[a-zA-Z]/.test(k)){ if(this.s.length<3) this.s+=k.toUpperCase(); return; } E.keyMenu(k); }
};

// ---- DEBUG: playtest any screen/minigame. Opened by 5 quick taps in the top-right corner. ----
SC.debug = {
  pi:0,
  // seed a realistic mid-game state so playtested screens show grown numbers, not the frozen 1926/245 start
  seed(pi){ newGame(DATA.pastors[pi],"short"); S.debug=true; S.year=2001; S.members=Math.round(lerpAnchors(DATA.memberAnchors,2001)); const i=S.landmarks.findIndex(l=>l.year>=2001); S.li=i>0?i:1; },
  enter(){ if(typeof S==="undefined" || !S || !S.pastor){ this.seed(this.pi); } },
  setLi(stop){ const i=S.landmarks.indexOf(stop); S.li = i>=0?i:0; },
  draw(){
    G.clear(C.BG);
    G.rect(0,0,640,26,C.PANEL); G.ctext("DEBUG -- PLAYTEST ANY SCREEN",320,7,C.TITLE,T.M);
    const cx=DATA.trail.find(t=>t.type==="cross"), land=DATA.trail.find(t=>t.type==="land"), ev=DATA.events[0];
    const btns=[
      ["Drive Home",()=>E.go("finale")],

      ["Landmark",()=>{this.setLi(land);E.go("landmark",land);}],
      ["Travel / map",()=>E.go("travel")],
      ["Event",()=>E.go("event",{ev:ev,next:"debug"})],
      ["Presbytery",()=>E.go("presbytery")],
      ["Win screen",()=>{S.homecoming=true;S.finaleWrong=false;E.go("win");}],
      ["Tally",()=>E.go("tally")],
      ["Leaderboard",()=>E.go("leaderboard")],
      ["Game over",()=>{S.over="stamina";E.go("gameover");}],

    ];

    const cy=y0+4*(bh+gy)+8;
    E.button("Reserves broke",14,cy,186,28,()=>{S.budget=0.05;},null,C.CLAY_INK);
    E.button("Reserves flush",208,cy,186,28,()=>{S.budget=2.0;},null,C.SAGE_INK);
    E.button("Pastor: "+S.pastor.short,402,cy,174,28,()=>{ this.pi=(this.pi+1)%DATA.pastors.length; this.seed(this.pi); },null,C.HARBOR_INK);
    const cy2=cy+34;
    G.text("year "+S.year+"   members "+Math.round(S.members)+"   reserves "+Math.round(S.budget*100)+"%   -- "+S.pastor.short,14,cy2,C.DIM,T.S);
    E.button("Back to title",14,cy2+14,186,28,()=>E.go("title"),"Escape",C.FRAME);
    E.button("Advance 10 years",208,cy2+14,186,28,()=>{ for(let i=0;i<10&&!S.over;i++) advanceYear(); },null,C.SAGE_INK);
    E.button("Reset sim (2001)",402,cy2+14,174,28,()=>this.seed(this.pi),null,C.STONE);
  },

};

// ===== minigame.js =====
// ============================================================
// STEWARDSHIP DRIVE: catch falling pledge cards in the Sanctuary
// ============================================================
SC.drive = {
  enter(a){ a=a||{}; this.back=a.back||"landmark"; this.backLm=a.lm||null; this.forced=!!a.forced;
    this.phase="intro"; this.t=0; this.cards=[]; this.caught=0; this.value=0; this.part=0; this.px=320; this.dir=0; this.burst=0; this.burstUsed=false; this.spawnT=0; this.touchX=null;
    this.cap=4+S.pastor.v; this.dur=20; const d=decade(); this.prior=S.drivesDecade[d]||0; this.moraleCost=this.prior?10:5;
    this.era = (S.year>=1930&&S.year<=1933)||(S.year>=2008&&S.year<=2009) ? "lean" : ((S.year>=1953&&S.year<=1957)||(S.year>=1997&&S.year<=2000)) ? "rich" : "normal"; },
  leave(stop){ if(this.back==="travel"){ E.go("travel"); } else if(this.back==="crossing"){ SC.crossing.result=null; E.go("crossing",this.backLm); } else if(this.back==="debug"){ E.go("debug"); } else E.go("landmark",{stop:true}); },
  start(){ this.phase="play"; this.t=0; S.driveLandmark=S.li; S.taughtDrive=true; S.drivesDecade[decade()]=this.prior+1; S.morale=clamp(S.morale-this.moraleCost,0,100); },
  spawn(){ const lp=S.pastor.c+S.pastor.p; const bigChance=clamp((lp-10)/10,0,0.8); const r=Math.random(); let size="s"; if(r<bigChance*0.35) size="l"; else if(r<0.55) size="m";
    const spd=(size==="l"?150:size==="m"?95:70)*(this.era==="lean"?1.3:1);
    const w=size==="l"?32:size==="m"?24:16, h=size==="l"?20:size==="m"?16:10;
    this.cards.push({x:40+Math.random()*560,y:30,size,spd,drift:size==="l"?(Math.random()-0.5)*120:0,w,h}); },
  cardValue(size){ const base={s:0.007,m:0.016,l:0.04}[size]; return base*(0.6+0.4*S.pastor.g/7)*paceMods().drive; },
  update(dt){ if(this.phase!=="play") return; this.t+=dt; if(this.burst>0) this.burst-=dt; const slow=this.burst>0?(0.25+(10-S.pastor.p)*0.05):1;
    if(this.touchX!=null){ const d=this.touchX-this.px; this.px+=clamp(d,-360*dt,360*dt); } else this.px+=this.dir*320*dt; this.px=clamp(this.px,36,604);
    this.spawnT-=dt; if(this.spawnT<=0){ this.spawn(); this.spawnT=(this.era==="lean"?1.1:this.era==="rich"?0.55:0.8)*(0.7+Math.random()*0.6); }
    this.cards.forEach(c=>{ c.y+=c.spd*slow*dt; c.x+=c.drift*slow*dt; if(c.x<20||c.x>620) c.drift*=-1; });
    const pr={x:this.px-30,y:250,w:60,h:40};
    this.cards=this.cards.filter(c=>{ if(c.y>300) return false; if(this.caught<this.cap && c.x+c.w>pr.x && c.x<pr.x+pr.w && c.y+c.h>pr.y && c.y<pr.y+pr.h){ this.caught++; this.value+=this.cardValue(c.size); this.part+={s:2,m:4,l:8}[c.size]; Sound.catchCard(); return false; } return true; });
    if(this.t>=this.dur || this.caught>=this.cap) this.finish(); },
  finish(){ this.phase="done"; S.drives=(S.drives||0)+1; S.budget+=this.value; S.part=clamp(S.part+this.part,0,100); if(this.caught>=this.cap) Sound.good(); },
  draw(){ drawInterior();
    G.draw(pastorFigure(S.pastor.id),this.px-32,246,2);
    this.cards.forEach(c=>G.draw(ART.card[c.size],c.x,c.y,2));
    // HUD
    G.rect(0,330,640,70,C.PANEL); G.rect(0,330,640,2,C.FRAME);
    G.text("Caught "+this.caught+" / "+this.cap,12,340,C.TEXT,T.M);
    G.text("Pledged +"+Math.round(this.value*100)+"% of funds",200,340,C.TITLE,T.M);
    G.rtext("Time "+Math.max(0,Math.ceil(this.dur-this.t)),628,340,C.TEXT,T.M);
    if(this.phase==="play"){ const bx=12,by=362; G.rect(bx,by,210,30,this.burstUsed?C.STONE:C.PLUM); G.frame(bx,by,210,30,C.FRAME,1); G.ctext(this.burst>0?"PREACHING...":"PREACH A SERMON",bx+105,by+8,C.TEXT,T.M);
      E.zone(bx,by,210,30,()=>{ if(!this.burstUsed){ this.burstUsed=true; this.burst=S.pastor.id==="jones"?6:3; S.stam=clamp(S.stam-8,0,100); Sound.beep(200,0.3); } });
      G.rtext("Drag, or tap a side, to move",628,368,C.DIM,T.S); }
    if(this.phase==="intro"){ G.box2(60,70,520,230,C.PANEL,C.TITLE); G.ctext("STEWARDSHIP DRIVE, "+S.year,320,86,C.TITLE,T.L);
      const il=(this.forced?["Funds are low, so Session calls a drive!"]:[]).concat(["Pledge cards fall from the balcony.","Catch them. The office can process "+this.cap+".","Each card adds Funds and Participation.","This drive costs Morale -"+this.moraleCost+(this.prior?" (second this decade).":"."),"Tap PREACH once to slow the cards (Stamina -8).",this.era==="lean"?"It is a lean year; cards are scarce.":this.era==="rich"?"It is a generous year.":""]).filter(Boolean);
      G.lines(il,84,114,this.forced?C.TEXT:C.TEXT,T.M,il.length>6?18:20);
      if(this.forced) E.button("Begin the drive",230,256,180,34,()=>this.start(),"Enter",C.SAGE_INK);
      else { E.button("Begin the drive",120,256,180,34,()=>this.start(),"Enter",C.SAGE_INK); E.button("Not now",340,256,180,34,()=>this.leave(),"Escape",C.STONE); } }
    if(this.phase==="done"){ G.box2(60,80,520,210,C.PANEL,C.TITLE); G.ctext("THE DRIVE IS OVER",320,96,C.TITLE,T.L);
      const tail=this.caught>=this.cap?["The office is buried in pledge cards!"]:["Maybe next year's stewardship letter","should be shorter."];
      G.lines(["You caught "+this.caught+" pledge card"+(this.caught===1?"":"s")+".","Funds +"+Math.round(this.value*100)+"%  (about $"+fmtMoney(this.value*lerpAnchors(DATA.budgetAnchors,S.year))+")","Participation +"+this.part].concat(tail),84,126,C.TEXT,T.M,22);
      E.button(this.back==="crossing"?"Back to the project":"Continue",200,250,240,34,()=>this.leave(),"Enter",C.SAGE_INK); } },
  tap(x,y){ if(this.phase==="play" && y<330){ this.touchX=x; return true; } return false; },
  move(x,y,down){ if(this.phase==="play" && down && y<330) this.touchX=x; },
  up(){ this.touchX=null; },
  key(k){ if(this.phase==="play"){ if(k==="ArrowLeft") this.dir=-1; else if(k==="ArrowRight") this.dir=1; else if(k===" "){ if(!this.burstUsed){ this.burstUsed=true; this.burst=S.pastor.id==="jones"?6:3; S.stam=clamp(S.stam-8,0,100); } } return; } E.keyMenu(k); },
  keyup(k){ if(k==="ArrowLeft"&&this.dir<0) this.dir=0; if(k==="ArrowRight"&&this.dir>0) this.dir=0; }
};
